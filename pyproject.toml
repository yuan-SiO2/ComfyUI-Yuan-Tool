[project]
name = "Yuan-Tool"
description = "ComfyUI custom nodes for MiniMax H3 video generation and LTX timeline workflows: image, text, audio, video, CLIP guide, latent upscale and sampling nodes."
version = "1.0.1"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["dependencies"]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/yuan-SiO2/ComfyUI-Yuan-Tool"
"Bug Tracker" = "https://github.com/yuan-SiO2/ComfyUI-Yuan-Tool/issues"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.comfy]
PublisherId = "yuan-SiO2"
DisplayName = "Yuan Tool"
